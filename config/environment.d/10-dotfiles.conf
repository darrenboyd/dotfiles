# Env for apps the systemd user manager starts (the Claude desktop app, D-Bus-activated and
# autostarted apps). COSMIC runs the session through `bash -l`, but only PATH and a few
# variables reach systemd --user, so profile.d's other exports never get to those apps.
# Mirrors home/profile.d; dot:check fails if a value here differs from a login shell's.
# Plain KEY=VALUE only (see environment.d(5)); PATH stays in profile.d.

# home/profile.d/32-postgres.sh
PGDATA=${HOME}/.pgdata
PGHOST=${HOME}/.pgdata

# home/profile.d/33-go.sh
GOPATH=${HOME}/code/go

# home/profile.d/40-ruby-gc.sh
RUBY_GC_MALLOC_LIMIT_MAX=90000000
RUBY_GC_HEAP_FREE_SLOTS=200000

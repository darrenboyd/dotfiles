config:
  default: true
  MD013: false   # line length
  MD033: false   # inline HTML
  MD036: false   # no emphasis as heading
  MD041: false   # first line must be an H1
  MD024: false   # duplicate headings
  MD060: false   # table-column-style
  # A table followed by text with no blank line turns that text into rows, so one
  # missing blank line fires these dozens of times. MD058 reports the actual cause.
  MD055: false   # table-pipe-style
  MD056: false   # table-column-count
